name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run npm publish --dry-run instead of publishing
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Create this environment in Settings > Environments with required
    # reviewers; the job pauses there before it can use the OIDC token.
    environment: npm-publish
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # No registry-url on purpose: setup-node would export a placeholder
      # NODE_AUTH_TOKEN, and npm skips the OIDC exchange whenever a token is
      # configured. npm already defaults to the public registry.
      - name: Use npm 11
        run: npm install -g npm@11
      - name: Install
        run: npm ci
      # Same script the CI release-check job runs on every pull request.
      - name: Release checks
        run: npm run release:check
      # Trusted publishing: npm detects the GitHub Actions OIDC environment and
      # exchanges the id-token for a short-lived publish credential. The
      # trusted publisher on npmjs.com must name this workflow and environment.
      - name: Publish with provenance
        if: ${{ !inputs.dry_run }}
        run: npm publish -w htmlcraft --provenance --access public
